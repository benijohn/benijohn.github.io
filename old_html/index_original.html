<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <title>Occlusion Inpainting</title>
  <LINK href="styles.css" rel="stylesheet" type="text/css">

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Comparison Slider</title>
  <style>
    /* Reset styles to avoid interference */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Slider container */
    .slider-container {
      position: relative;
      display: inline-block; /* Allows inline placement */
      width: 256px; /* Match image width */
      height: 256px; /* Match image height */
      overflow: hidden;
      border: 1px solid #ddd;
    }

    /* Base image */
    .image-wrapper img {
      width: 256px;
      height: 256px;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Overlay for the right image */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%; /* Default slider position */
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .overlay img {
      width: 256px;
      height: 256px;
      object-fit: cover;
    }

    /* Slider bar */
    .slider {
      position: absolute;
      top: 0;
      left: 50%; /* Default position */
      width: 4px;
      height: 100%;
      background-color: #000;
      cursor: ew-resize;
      z-index: 10;
    }
  </style>
</head>

<body>

<img src="https://octodex.github.com/images/daftpunktocat-thomas.gif" id="octocat" alt="octocat-gif" />

<img src="images/uncertain_map_icar.png" id="test_image" alt="icar-png" />

<!-- Change this code here by copy and pasting your template on line 15 -->
<p>Hello! Welcome to our project webpage. We are trying to enable better planning through data-driven "hallucinations" combined with quantifying the confidence of the inference.</p>


<div class="container">
  <div class="image-wrapper">
    <img src="images/slider_imgs/train_map_gt.png" alt="Ground Truth">
    <div class="overlay">
      <img src="images/slider_imgs/train_map_painted.jpg" alt="Unpainted">
    </div>
    <div class="slider"></div>
  </div>
</div>

<script>
  const container = document.querySelector('.slider-container');
  const overlay = document.querySelector('.overlay');
  const slider = document.querySelector('.slider');

  let isDragging = false;

  const startDrag = () => {
    isDragging = true;
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', stopDrag);
  };

  const drag = (e) => {
    if (!isDragging) return;

    const rect = container.getBoundingClientRect();
    let offsetX = e.clientX - rect.left;

    // Clamp the slider's position within the container
    offsetX = Math.max(0, Math.min(offsetX, rect.width));

    const percentage = (offsetX / rect.width) * 100;

    // Update overlay and slider position
    overlay.style.width = `${percentage}%`;
    slider.style.left = `${percentage}%`;
  };

  const stopDrag = () => {
    isDragging = false;
    document.removeEventListener('mousemove', drag);
    document.removeEventListener('mouseup', stopDrag);
  };

  slider.addEventListener('mousedown', startDrag);
</script>

</body>
</html>
