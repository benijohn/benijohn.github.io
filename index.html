<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Auto-Scaled Slider</title>
  <style>
    /* Reset styles to avoid interference */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body: Center everything on the screen */
    body {
      display: flex;
      justify-content: center; /* Horizontally center */
      align-items: center; /* Vertically center */
      height: 100vh; /* Full screen height */
      background-color: #f8f8f8; /* Light background color */
    }

    /* Flex container for sliders */
    .slider-group {
      display: flex;
      justify-content: space-around; /* Distribute sliders evenly */
      gap: 20px; /* Add space between sliders */
      flex-wrap: wrap; /* Wrap sliders on smaller screens */
    }

    /* Individual slider container */
    .slider-item {
      text-align: center; /* Center text labels */
      max-width: 800px;
    }

   /* Slider container */
   .slider-container {
      position: relative;
      width: 100%; /* Responsive width */
      aspect-ratio: 1; /* Keep container square */
      border: 1px solid #ccc;
      overflow: hidden;
    }

    /* Base image (bottom image) */
    .slider-container img.base {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Overlay image (top image) */
    .slider-container img.overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      clip-path: inset(0 50% 0 0); /* Initially reveal half of the bottom image */
    }


    /* Slider bar */
    .slider {
      position: absolute;
      top: 0;
      left: 50%; /* Default slider position */
      width: 10px; /* Slightly wider for better usability */
      height: 100%;
      background-color: #000;
      cursor: ew-resize;
      transform: translateX(-50%); /* Center the bar */
      z-index: 10;
    }

    /* Expand clickable area */
    .slider::after {
      content: '';
      position: absolute;
      top: 0;
      left: -5px;
      width: 20px; /* Expands the clickable area */
      height: 100%;
      cursor: ew-resize;
    }

    /* Caption styling */
    .caption {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

  </style>
</head>
<body>


      <!-- Slider container -->
  <div class="slider-container" style="width: 300px; height: 300px; background-color: lightblue;">
    <!-- Bottom image -->
    <img src="images/slider_imgs/train_map_gt.png" alt="Ground Truth" class="base">
    <!-- Top image -->
    <img src="images/slider_imgs/train_map_painted.jpg" alt="Unpainted" class="overlay">
    <!-- Slider bar -->
    <div class="slider"></div>
  </div>


  <h1 style="text-align: center; margin-bottom: 20px;">Image Comparison Sliders</h1>

  <!-- Group of sliders -->
  <div class="slider-group">
    <!-- Slider 1 -->
    <div class="slider-item">
      <h3>Slider 1: Example A</h3>
            <!-- Slider container -->
    <div class="slider-container">
      <!-- Bottom image -->
      <img src="images/slider_imgs/train_map_gt.png" alt="Ground Truth" class="base">
      <!-- Top image -->
      <img src="images/slider_imgs/train_map_painted.jpg" alt="Unpainted" class="overlay">
      <!-- Slider bar -->
      <div class="slider"></div>
    </div>
      <p class="caption">Caption for Slider 1</p>
    </div>

    <!-- Slider 2 -->
    <div class="slider-item">
      <h3>Slider 2: Example B</h3>
            <!-- Slider container -->
    <div class="slider-container">
      <!-- Bottom image -->
      <img src="images/slider_imgs/train_map_gt.png" alt="Ground Truth" class="base">
      <!-- Top image -->
      <img src="images/slider_imgs/train_map_painted.jpg" alt="Unpainted" class="overlay">
      <!-- Slider bar -->
      <div class="slider"></div>
    </div>
      <p class="caption">Caption for Slider 2</p>
    </div>

    <!-- Slider 3 -->
    <div class="slider-item">
      <h3>Slider 3: Example C</h3>
            <!-- Slider container -->
    <div class="slider-container">
      <!-- Bottom image -->
      <img src="images/slider_imgs/train_map_gt.png" alt="Ground Truth" class="base">
      <!-- Top image -->
      <img src="images/slider_imgs/train_map_painted.jpg" alt="Unpainted" class="overlay">
      <!-- Slider bar -->
      <div class="slider"></div>
    </div>
      <p class="caption">Caption for Slider 3</p>
    </div>
  </div>



  <script>
    const container = document.querySelector('.slider-container');
    const overlay = document.querySelector('.overlay');
    const slider = document.querySelector('.slider');

    let isDragging = false;

    // Start dragging
    const startDrag = (e) => {
      isDragging = true;
      document.addEventListener('mousemove', drag);
      document.addEventListener('mouseup', stopDrag);
    };

    // Dragging logic
    const drag = (e) => {
      if (!isDragging) return;

      const rect = container.getBoundingClientRect();
      let offsetX = e.clientX - rect.left;

      // Clamp slider position within the container
      offsetX = Math.max(0, Math.min(offsetX, rect.width));

      // Update slider position
      const percentage = (offsetX / rect.width) * 100;
      slider.style.left = `${percentage}%`;

      // Reveal the top image based on the slider's position
      overlay.style.clipPath = `inset(0 ${100 - percentage}% 0 0)`;
    };

    // Stop dragging
    const stopDrag = () => {
      isDragging = false;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('mouseup', stopDrag);
    };

    // Attach events
    slider.addEventListener('mousedown', startDrag);
  </script>

<script>
  // Attach slider functionality to all sliders
  document.querySelectorAll('.slider-container').forEach((container) => {
    const overlay = container.querySelector('.overlay');
    const slider = container.querySelector('.slider');

    let isDragging = false;

    const startDrag = () => {
      isDragging = true;
      document.addEventListener('mousemove', drag);
      document.addEventListener('mouseup', stopDrag);
    };

    const drag = (e) => {
      if (!isDragging) return;

      const rect = container.getBoundingClientRect();
      let offsetX = e.clientX - rect.left;

      // Constrain slider position
      offsetX = Math.max(0, Math.min(offsetX, rect.width));

      // Update slider position and overlay visibility
      const percentage = (offsetX / rect.width) * 100;
      slider.style.left = `${percentage}%`;
      overlay.style.clipPath = `inset(0 ${100 - percentage}% 0 0)`;
    };

    const stopDrag = () => {
      isDragging = false;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('mouseup', stopDrag);
    };

    slider.addEventListener('mousedown', startDrag);
  });
</script>

</body>
</html>
