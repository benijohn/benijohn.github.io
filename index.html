<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <title>Occlusion Inpainting</title>
  <LINK href="styles.css" rel="stylesheet" type="text/css">

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Comparison Slider</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
    }

    .container {
      position: relative;
      width: 80%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    .image-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%; /* Default position */
      height: 100%;
      overflow: hidden;
    }

    .overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
    }

    .slider {
      position: absolute;
      top: 0;
      left: 50%; /* Default position */
      width: 4px;
      height: 100%;
      background-color: #000;
      cursor: ew-resize;
      z-index: 10;
    }
  </style>
</head>

<body>

<img src="https://octodex.github.com/images/daftpunktocat-thomas.gif" id="octocat" alt="octocat-gif" />

<img src="images/uncertain_map_icar.png" id="test_image" alt="icar-png" />

<!-- Change this code here by copy and pasting your template on line 15 -->
<p>Hello! Welcome to our project webpage. We are trying to enable better planning through data-driven "hallucinations" combined with quantifying the confidence of the inference.</p>


<div class="container">
  <div class="image-wrapper">
    <img src="ground-truth.jpg" alt="Ground Truth">
    <div class="overlay">
      <img src="unpainted.jpg" alt="Unpainted">
    </div>
    <div class="slider"></div>
  </div>
</div>

<script>
  const container = document.querySelector('.container');
  const overlay = document.querySelector('.overlay');
  const slider = document.querySelector('.slider');

  let isDragging = false;

  const startDrag = () => {
    isDragging = true;
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', stopDrag);
  };

  const drag = (e) => {
    if (!isDragging) return;

    const rect = container.getBoundingClientRect();
    let offsetX = e.clientX - rect.left;

    // Clamp offsetX to stay within the container bounds
    offsetX = Math.max(0, Math.min(offsetX, rect.width));

    const percentage = (offsetX / rect.width) * 100;

    overlay.style.width = `${percentage}%`;
    slider.style.left = `${percentage}%`;
  };

  const stopDrag = () => {
    isDragging = false;
    document.removeEventListener('mousemove', drag);
    document.removeEventListener('mouseup', stopDrag);
  };

  slider.addEventListener('mousedown', startDrag);
</script>

</body>
</html>
